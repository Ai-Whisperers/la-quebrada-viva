<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Quebrada Viva — Cesium Preview</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  .lqv-overlay {
    position: absolute; top: 16px; left: 16px;
    background: rgba(12, 15, 10, 0.92); color: #e8e0d0;
    border: 1px solid rgba(194, 168, 120, 0.3);
    border-radius: 4px; padding: 16px 20px;
    font-family: Georgia, serif; max-width: 380px;
    backdrop-filter: blur(12px); z-index: 10;
  }
  .lqv-overlay h1 { font-size: 22px; font-weight: 400; margin-bottom: 4px; }
  .lqv-overlay h1 em { font-style: italic; color: #c2a878; }
  .lqv-overlay .eyebrow { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: #7d6a4a; margin-bottom: 8px; font-family: 'Courier New', monospace; }
  .lqv-overlay .coords { font-size: 11px; color: #7d6a4a; margin-top: 12px; font-family: 'Courier New', monospace; }
  .lqv-overlay .stale-banner {
    margin-top: 12px;
    padding: 8px 10px;
    background: rgba(194, 168, 120, 0.08);
    border-left: 2px solid #c2a878;
    font-size: 11px;
    color: #c2a878;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div class="lqv-overlay">
  <div class="eyebrow">Cesium Preview</div>
  <h1>La Quebrada <em>Viva</em></h1>
  <div class="stale-banner">
    This is a Cesium JS preview validating the asset pipeline.<br>
    The full game uses Unreal Engine 5.7 + Cesium for Unreal + Nanite + Lumen.
  </div>
  <div class="coords">62 ha · Escobar, Paraguarí, Paraguay<br>Centroid -57.030, -25.630</div>
</div>

<script>
// Cesium ion token not needed for this preview — we use a SingleTileImageryProvider
// pointing at our local Esri HD PNG.
Cesium.Ion.defaultAccessToken = ''; // intentionally blank — we don't use ion

// Detect WebGL availability (e.g. headless / old browsers / some Linux setups)
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}
if (!hasWebGL()) {
  document.body.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0c0f0a;color:#e8e0d0;font-family:Georgia,serif;padding:40px;text-align:center"><div><h1 style="font-size:32px;margin-bottom:16px;color:#c2a878">La Quebrada Viva — Preview</h1><p style="max-width:480px;line-height:1.6;color:#7d6a4a">This browser does not support WebGL.<br><br>The Cesium preview needs WebGL to render the 3D map. Try a desktop browser with WebGL enabled (Chrome, Firefox, Edge, Safari 15+).<br><br>The asset pipeline itself works — verify at <a href="https://github.com/Ai-Whisperers/la-quebrada-viva/tree/master/docs/game_assets" style="color:#c2a878">the repo</a>.</p></div></div>';
  throw new Error('No WebGL');
}

const viewer = new Cesium.Viewer('cesiumContainer', {
  baseLayerPicker: false,
  geocoder: false,
  homeButton: false,
  sceneModePicker: true,
  navigationHelpButton: false,
  animation: false,
  timeline: false,
  fullscreenButton: true,
  infoBox: false,
  selectionIndicator: false,
  // Skip terrain entirely — we use a flat ellipsoid (no 3D terrain in JS preview)
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),
  imageryProvider: new Cesium.SingleTileImageryProvider({
    url: './textures/lqv_esri_z17_2km.png',
    rectangle: Cesium.Rectangle.fromDegrees(-57.041, -25.642, -57.019, -25.618),
    tileWidth: 1792, tileHeight: 1792,
    credit: '© Esri, Maxar, Earthstar Geographics'
  })
});

// Anchor at LQV centroid, looking down at 1km altitude for context
viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(-57.030, -25.625, 1200),
  orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-45), roll: 0 },
  duration: 0
});

// Property polygon (62 ha escritura polygon) — from lqv_property_polygon.geojson
// Note: clampToGround requires terrain. We use the default ellipsoid and
// let the polygon float slightly above; visually fine for a 2D top-down preview.
Cesium.GeoJsonDataSource.load('./geodata/lqv_property_polygon.geojson', {
  stroke: Cesium.Color.fromCssColorString('#c2a878'),
  fill: Cesium.Color.fromCssColorString('#c2a878').withAlpha(0.3),
  strokeWidth: 2
}).then(ds => viewer.dataSources.add(ds)).catch(e => console.warn('property polygon:', e));

// AOI bbox (1100 ha) — lighter color
Cesium.GeoJsonDataSource.load('./geodata/lqv_aoi_bbox.geojson', {
  stroke: Cesium.Color.fromCssColorString('#7d6a4a'),
  fill: Cesium.Color.TRANSPARENT,
  strokeWidth: 1
}).then(ds => viewer.dataSources.add(ds)).catch(e => console.warn('aoi bbox:', e));

// Waterfall candidates (top 5)
fetch('./geodata/lqv_waterfall_candidates.geojson').then(r => r.json()).then(gj => {
  gj.features.forEach((f, i) => {
    const [lon, lat] = f.geometry.coordinates;
    const drop = f.properties.drop_m || 0;
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, lat),
      point: { pixelSize: 14, color: Cesium.Color.fromCssColorString('#5fa8d3'), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
      label: {
        text: `Waterfall ${i+1} (${drop}m drop)`,
        font: '11px monospace',
        fillColor: Cesium.Color.WHITE,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 2,
        pixelOffset: new Cesium.Cartesian2(0, -22)
      }
    });
  });
});

// Quebrada polygons (stream network) — light blue
Cesium.GeoJsonDataSource.load('./geodata/lqv_quebrada_polygon.geojson', {
  stroke: Cesium.Color.fromCssColorString('#3d7da3'),
  fill: Cesium.Color.fromCssColorString('#3d7da3').withAlpha(0.4),
  strokeWidth: 1
}).then(ds => viewer.dataSources.add(ds)).catch(e => console.warn('quebrada:', e));

// Solar PV zones (north-facing slopes)
Cesium.GeoJsonDataSource.load('./geodata/lqv_solar_pv_zones.geojson', {
  stroke: Cesium.Color.fromCssColorString('#d4a52a'),
  fill: Cesium.Color.fromCssColorString('#d4a52a').withAlpha(0.3),
  strokeWidth: 1
}).then(ds => viewer.dataSources.add(ds)).catch(e => console.warn('solar:', e));

</script>
</body>
</html>
