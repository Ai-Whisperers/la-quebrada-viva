<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Quebrada Viva — Escobar 3D</title>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { background: #0c0f0a; font-family: 'Georgia', serif; color: #e8e0d0; }

  /* Top-left info panel */
  .lqv-panel {
    position: absolute; top: 16px; left: 16px;
    background: rgba(12, 15, 10, 0.92); color: #e8e0d0;
    border: 1px solid rgba(194, 168, 120, 0.3);
    border-radius: 4px; padding: 14px 18px;
    font-family: Georgia, serif; max-width: 320px;
    backdrop-filter: blur(12px); z-index: 10;
  }
  .lqv-panel h1 { font-size: 20px; font-weight: 400; margin-bottom: 4px; }
  .lqv-panel h1 em { font-style: italic; color: #c2a878; }
  .lqv-panel .eyebrow { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: #7d6a4a; margin-bottom: 6px; font-family: 'Courier New', monospace; }
  .lqv-panel .coords { font-size: 10px; color: #7d6a4a; margin-top: 8px; font-family: 'Courier New', monospace; line-height: 1.5; }

  /* LOD badge */
  .lqv-lod {
    position: absolute; top: 16px; right: 16px;
    background: rgba(12, 15, 10, 0.92); color: #e8e0d0;
    border: 1px solid rgba(194, 168, 120, 0.3);
    border-radius: 4px; padding: 10px 14px;
    backdrop-filter: blur(12px); z-index: 10;
    font-family: 'Courier New', monospace; font-size: 11px;
    min-width: 200px;
  }
  .lqv-lod .lod-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #7d6a4a; margin-bottom: 4px; }
  .lqv-lod .lod-name { color: #c2a878; font-size: 14px; font-weight: 600; }
  .lqv-lod .lod-meta { color: #7d6a4a; font-size: 10px; margin-top: 4px; line-height: 1.4; }

  /* Bottom-left layer toggles */
  .lqv-layers {
    position: absolute; bottom: 16px; left: 16px;
    background: rgba(12, 15, 10, 0.92); color: #e8e0d0;
    border: 1px solid rgba(194, 168, 120, 0.3);
    border-radius: 4px; padding: 12px 14px;
    backdrop-filter: blur(12px); z-index: 10;
    font-family: 'Courier New', monospace; font-size: 11px;
    min-width: 220px;
  }
  .lqv-layers .section-title { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: #7d6a4a; margin: 0 0 8px 0; }
  .lqv-layers label { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; user-select: none; }
  .lqv-layers label:hover { color: #c2a878; }
  .lqv-layers input[type=checkbox] { accent-color: #c2a878; }
  .lqv-layers .layer-section { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px solid rgba(194, 168, 120, 0.15); }
  .lqv-layers .layer-section:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

  /* WebGL fallback */
  .no-webgl {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0c0f0a; color: #e8e0d0; font-family: Georgia, serif; padding: 40px; text-align: center;
  }
  .no-webgl h1 { font-size: 32px; margin-bottom: 16px; color: #c2a878; }
  .no-webgl p { max-width: 480px; line-height: 1.6; color: #7d6a4a; }
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<div class="lqv-panel">
  <div class="eyebrow">Escobar · Paraguarí · Paraguay</div>
  <h1>La Quebrada <em>Viva</em></h1>
  <div class="coords">
    62 ha · Centroid -57.030, -25.630<br>
    Real terrain · Real imagery · LOD by distance
  </div>
</div>

<div class="lqv-lod">
  <div class="lod-label">Active LOD</div>
  <div class="lod-name" id="lodName">— loading —</div>
  <div class="lod-meta" id="lodMeta"></div>
</div>

<div class="lqv-layers">
  <div class="layer-section">
    <div class="section-title">Property</div>
    <label><input type="checkbox" data-layer="parcel" checked> 62 ha polygon</label>
    <label><input type="checkbox" data-layer="aoi" checked> 1100 ha AOI bbox</label>
  </div>
  <div class="layer-section">
    <div class="section-title">Topography</div>
    <label><input type="checkbox" data-layer="buildability" checked> Buildability zones</label>
    <label><input type="checkbox" data-layer="quebrada" checked> Quebrada streams</label>
    <label><input type="checkbox" data-layer="solar" checked> Solar PV zones</label>
  </div>
  <div class="layer-section">
    <div class="section-title">Features</div>
    <label><input type="checkbox" data-layer="waterfall" checked> Waterfall candidates</label>
    <label><input type="checkbox" data-layer="roads"> OSM roads</label>
    <label><input type="checkbox" data-layer="waterways"> OSM waterways</label>
  </div>
</div>

<script>
// WebGL detection
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}
if (!hasWebGL()) {
  document.body.innerHTML = '<div class="no-webgl"><div><h1>La Quebrada Viva — 3D Map</h1><p>This browser does not support WebGL.<br><br>The 3D terrain viewer needs WebGL to render. Try a desktop browser with WebGL enabled (Chrome, Firefox, Edge, Safari 15+).<br><br>Asset pipeline verified — see <a href="https://github.com/Ai-Whisperers/la-quebrada-viva/tree/master/docs/game_assets" style="color:#c2a878">the repo</a>.</p></div></div>';
  throw new Error('No WebGL');
}

Cesium.Ion.defaultAccessToken = ''; // no ion token needed

// =============================================================================
// LOD configuration
// =============================================================================
const LODS = [
  {
    id: 0,
    name: 'Parcel',
    desc: '1.5 m / pixel · 1.5 km × 1.5 km',
    heightmapUrl: './game_assets_lite/assets/heightmaps/lod0_terrain.png',
    heightmapBounds: [-57.037494, -25.636757, -57.022506, -25.623243], // W, S, E, N
    heightmapSize: [1024, 1024],
    heightmapRange: [124.9, 182.3], // elev min/max
    imageryUrl: './game_assets_lite/assets/textures/lqv_esri_z17_2km.png',
    imageryBounds: [-57.041, -25.642, -57.019, -25.618],
    imagerySize: [1792, 1792],
    exaggeration: 100, // UE5-style exaggeration so relief reads as proper hills
    viewRadius: 500,
  },
  {
    id: 1,
    name: 'Escobar',
    desc: '15 m / pixel · 7.7 km × 7.7 km',
    heightmapUrl: './game_assets_lite/assets/heightmaps/lod1_terrain.png',
    heightmapBounds: [-57.068470, -25.664685, -56.991530, -25.595315],
    heightmapSize: [512, 512],
    heightmapRange: [100.9, 436.3],
    imageryUrl: './game_assets_lite/assets/textures/lods/lod1_imagery.jpg',
    imageryBounds: [-57.0685, -25.6647, -56.9915, -25.5953],
    imagerySize: [1024, 1024],
    exaggeration: 30,
    viewRadius: 5000,
  },
  {
    id: 2,
    name: 'Regional',
    desc: '60 m / pixel · 23 km × 23 km',
    heightmapUrl: './game_assets_lite/assets/heightmaps/lod2_terrain.png',
    heightmapBounds: [-57.144910, -25.733604, -56.915090, -25.526396],
    heightmapSize: [384, 384],
    heightmapRange: [88.0, 492.4],
    imageryUrl: './game_assets_lite/assets/textures/lods/lod2_imagery.jpg',
    imageryBounds: [-57.1449, -25.7336, -56.9151, -25.5263],
    imagerySize: [512, 512],
    exaggeration: 10,
    viewRadius: 30000,
  },
];

// =============================================================================
// Cesium viewer setup
// =============================================================================
const viewer = new Cesium.Viewer('cesiumContainer', {
  baseLayerPicker: false,
  geocoder: false,
  homeButton: false,
  sceneModePicker: true,
  navigationHelpButton: false,
  animation: false,
  timeline: false,
  fullscreenButton: true,
  infoBox: false,
  selectionIndicator: false,
  // No terrain initially — we'll add it manually via HeightmapTerrainProvider
  terrainProvider: new Cesium.EllipsoidTerrainProvider(),
});

// No sky atmosphere / sun — keep it simple
viewer.scene.skyAtmosphere.show = true;
viewer.scene.globe.enableLighting = false;
viewer.scene.globe.depthTestAgainstTerrain = true;
viewer.scene.fog.enabled = false;

// Hide credit container bottom-right (we'll add attribution ourselves)
viewer._cesiumWidget._creditContainer.style.display = 'none';

// =============================================================================
// LOD state + provider swapping
// =============================================================================
let activeLodId = -1;
let activeLayers = {}; // layer name → entity collection

const lodNameEl = document.getElementById('lodName');
const lodMetaEl = document.getElementById('lodMeta');

function applyLod(lodId) {
  if (lodId === activeLodId) return;
  const lod = LODS[lodId];
  console.log(`[LOD] Switching to LOD${lod.id} (${lod.name})`);

  // 1. Replace terrain with this LOD's heightmap
  const heightmapProvider = new Cesium.HeightmapTerrainProvider({
    url: lod.heightmapUrl,
    credit: new Cesium.Credit(`LQV heightmap LOD${lod.id} (ALOS + AWS terrain-rgb)`),
    width: lod.heightmapSize[0],
    height: lod.heightmapSize[1],
    tilingScheme: new Cesium.GeographicTilingScheme(),
    rectangle: Cesium.Rectangle.fromDegrees(...lod.heightmapBounds),
    minimumLevel: 0,
    maximumLevel: lod.id,  // LOD0 = level 0, LOD1 = level 1, LOD2 = level 2
  });
  viewer.terrainProvider = heightmapProvider;

  // 2. Replace imagery layer
  viewer.imageryLayers.removeAll();
  const imageryProvider = new Cesium.SingleTileImageryProvider({
    url: lod.imageryUrl,
    rectangle: Cesium.Rectangle.fromDegrees(...lod.imageryBounds),
    tileWidth: lod.imagerySize[0],
    tileHeight: lod.imagerySize[1],
    credit: new Cesium.Credit(`Esri World Imagery (z=${lod.id === 0 ? 17 : lod.id === 1 ? 15 : 11}) © Esri, Maxar, Earthstar Geographics`),
  });
  viewer.imageryLayers.addImageryProvider(imageryProvider);

  // 3. Set vertical exaggeration
  viewer.scene.verticalExaggeration = lod.exaggeration;

  // 4. Update LOD badge
  lodNameEl.textContent = `LOD ${lod.id} · ${lod.name}`;
  lodMetaEl.textContent = lod.desc;

  activeLodId = lodId;

  // 5. Update overlay visibility based on LOD
  updateOverlayVisibilityByLod();
}

// Forward declaration so applyLod can call it
function updateOverlayVisibilityByLod() {
  const showDetailed = (activeLodId === 0 || activeLodId === 1);
  if (activeLayers.roads) activeLayers.roads.show = showDetailed && document.querySelector('[data-layer=roads]').checked;
  if (activeLayers.waterways) activeLayers.waterways.show = showDetailed && document.querySelector('[data-layer=waterways]').checked;
}

function cameraDistanceToCentroidMeters() {
  const cameraPos = viewer.camera.positionCartographic;
  const centroid = Cesium.Cartographic.fromDegrees(-57.030, -25.630);
  const ellipsoid = Cesium.Ellipsoid.WGS84;
  // Approximate horizontal distance using geodesic surface
  const geodesic = new Cesium.EllipsoidGeodesic(cameraPos, centroid);
  return geodesic.surfaceDistance;
}

function lodFromDistance(distM) {
  // LOD0: 0-500m, LOD1: 500m-5km, LOD2: 5km+
  if (distM < 750) return 0;       // include a bit of overlap for smooth transitions
  if (distM < 7500) return 1;
  return 2;
}

// Throttled LOD update
let lastLodUpdate = 0;
function updateLodIfNeeded() {
  const now = performance.now();
  if (now - lastLodUpdate < 250) return; // throttle to 4 fps
  lastLodUpdate = now;

  const dist = cameraDistanceToCentroidMeters();
  const desiredLod = lodFromDistance(dist);
  if (desiredLod !== activeLodId) {
    applyLod(desiredLod);
  }
}

viewer.scene.postRender.addEventListener(updateLodIfNeeded);

// =============================================================================
// Initial camera position (oblique view of parcel)
// =============================================================================
viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(-57.026, -25.622, 350),
  orientation: { heading: Cesium.Math.toRadians(-25), pitch: Cesium.Math.toRadians(-22), roll: 0 },
  duration: 0,
});

// =============================================================================
// Topology overlays — initial LOD0 only (visible only when zoomed in)
// =============================================================================
async function loadOverlays() {
  const BASE = './game_assets_lite/assets/geodata';
  const colors = {
    parcel: Cesium.Color.fromCssColorString('#c2a878').withAlpha(0.4),
    aoi: Cesium.Color.fromCssColorString('#7d6a4a').withAlpha(0.2),
    buildability: Cesium.Color.fromCssColorString('#4a90e2').withAlpha(0.35),
    quebrada: Cesium.Color.fromCssColorString('#5fa8d3').withAlpha(0.55),
    solar: Cesium.Color.fromCssColorString('#d4a52a').withAlpha(0.45),
    waterfall: Cesium.Color.fromCssColorString('#5fa8d3'),
    roads: Cesium.Color.fromCssColorString('#ffffff').withAlpha(0.7),
    waterways: Cesium.Color.fromCssColorString('#3d7da3'),
  };

  // Property polygon (gold outline)
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_property_polygon.geojson`, {
    stroke: Cesium.Color.fromCssColorString('#c2a878'),
    fill: colors.parcel,
    strokeWidth: 3,
  }).then(ds => { viewer.dataSources.add(ds); activeLayers.parcel = ds; }).catch(e => console.warn('parcel:', e));

  // AOI bbox (dim gold)
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_aoi_bbox.geojson`, {
    stroke: colors.aoi,
    fill: Cesium.Color.TRANSPARENT,
    strokeWidth: 1,
  }).then(ds => { viewer.dataSources.add(ds); activeLayers.aoi = ds; }).catch(e => console.warn('aoi:', e));

  // Buildability zones (blue tones)
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_buildability_zones.geojson`, {
    stroke: Cesium.Color.fromCssColorString('#4a90e2'),
    fill: colors.buildability,
    strokeWidth: 1,
  }).then(ds => { viewer.dataSources.add(ds); activeLayers.buildability = ds; }).catch(e => console.warn('buildability:', e));

  // Quebrada streams
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_quebrada_polygon.geojson`, {
    stroke: colors.quebrada,
    fill: colors.quebrada,
    strokeWidth: 1,
  }).then(ds => { viewer.dataSources.add(ds); activeLayers.quebrada = ds; }).catch(e => console.warn('quebrada:', e));

  // Solar PV zones
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_solar_pv_zones.geojson`, {
    stroke: colors.solar,
    fill: colors.solar,
    strokeWidth: 1,
  }).then(ds => { viewer.dataSources.add(ds); activeLayers.solar = ds; }).catch(e => console.warn('solar:', e));

  // Waterfall candidates as point entities
  fetch(`${BASE}/lqv_waterfall_candidates.geojson`).then(r => r.json()).then(gj => {
    gj.features.forEach((f, i) => {
      const [lon, lat] = f.geometry.coordinates;
      const drop = f.properties.drop_m || 0;
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(lon, lat),
        point: { pixelSize: 12, color: colors.waterfall, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
        label: {
          text: `Waterfall ${i + 1} (${drop}m)`,
          font: '10px monospace',
          fillColor: Cesium.Color.WHITE,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          pixelOffset: new Cesium.Cartesian2(0, -18),
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 5000),
        }
      });
    });
  }).catch(e => console.warn('waterfall:', e));

  // OSM roads (only shown when zoomed in — distance display condition)
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_osm_roads.geojson`, {
    stroke: colors.roads,
    fill: Cesium.Color.TRANSPARENT,
    strokeWidth: 1.5,
    clampToGround: true,
  }).then(ds => {
    viewer.dataSources.add(ds);
    activeLayers.roads = ds;
    // Hide by default (only show at LOD0/LOD1)
    ds.show = false;
  }).catch(e => console.warn('roads:', e));

  // OSM waterways
  Cesium.GeoJsonDataSource.load(`${BASE}/lqv_osm_waterways.geojson`, {
    stroke: colors.waterways,
    fill: colors.waterways.withAlpha(0.5),
    strokeWidth: 2,
  }).then(ds => {
    viewer.dataSources.add(ds);
    activeLayers.waterways = ds;
    ds.show = false;
  }).catch(e => console.warn('waterways:', e));
}

// =============================================================================
// Layer toggle UI
// =============================================================================
document.querySelectorAll('.lqv-layers input[type=checkbox]').forEach(input => {
  input.addEventListener('change', () => {
    const layerName = input.dataset.layer;
    const ds = activeLayers[layerName];
    if (ds) ds.show = input.checked;
  });
});

// =============================================================================
// Auto-hide roads/waterways at far LODs — handled inside applyLod now
// =============================================================================

// =============================================================================
// Kick off
// =============================================================================
applyLod(0);  // Start with LOD0 (close zoom)
loadOverlays();

console.log('[LQV] Viewer initialised. Scroll/drag to navigate.');
</script>

</body>
</html>
